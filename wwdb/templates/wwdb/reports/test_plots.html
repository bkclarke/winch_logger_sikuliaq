<!doctype html>
{% extends "wwdb/base.html" %}
{% load static %}

{% block content %}

<br>

<form method="get" id="dateRangeForm" class="date-filter-form">

    <div class="date-filter-group">

        <label for="start_date">
            Start:
        </label>

        <input type="datetime-local"
               id="start_date"
               name="start_date"
               class="form-control"
               value="{{ start_date }}"
               step="1"
               required>

    </div>


    <div class="date-filter-group">

        <label for="end_date">
            End:
        </label>

        <input type="datetime-local"
               id="end_date"
               name="end_date"
               class="form-control"
               value="{{ end_date }}"
               step="1"
               required>

    </div>


    <div class="date-filter-action">

        <button type="submit"
                class="btn btn-primary">
            Filter Data
        </button>

    </div>

</form>

<br>


<!-- =============================================================
     TEST MODE MESSAGE
     ============================================================= -->

<div class="alert alert-info">
    <strong>Test Mode:</strong>
    This chart uses generated dummy data and does not access
    the production database.
</div>


<!-- =============================================================
     ZOOM STATUS
     ============================================================= -->

<div id="zoomStatus"
     class="alert alert-secondary"
     style="display:none;">
    Loading higher-resolution data...
</div>

<br>


<!-- =============================================================
     CHART
     ============================================================= -->

<div class="chart-controls">

    <button type="button"
            id="resetZoom"
            class="btn btn-warning">
        ↺ Reset Zoom
    </button>

</div>

<div class="chart-instructions">
    <strong>Zoom:</strong>
    Click and drag across the chart to zoom into a specific time range.
</div>

<div id="container"
     style="width:100%; height:500px;">
</div>

<br>


<!-- =============================================================
     INFORMATION
     ============================================================= -->

<style>
    .highcharts-reset-zoom {
        display: none !important;
    }

    .highcharts-exporting-group {
        display: none !important;
    }

    /* =========================================================
       DATE FILTER FORM
       ========================================================= */

    .date-filter-form {
        display: flex;
        align-items: end;
        gap: 20px;
        flex-wrap: wrap;
        margin-bottom: 15px;
    }


    .date-filter-group {
        display: flex;
        flex-direction: column;
        gap: 5px;
    }


    .date-filter-group label {
        font-weight: 600;
    }


    .date-filter-group .form-control {
        width: 250px;
    }


    .date-filter-action {
        display: flex;
        align-items: end;
    }


    /* =========================================================
       CHART CONTROLS
       ========================================================= */

    .chart-controls {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        margin-bottom: 8px;
    }


    #resetZoom {
        font-size: 1rem;
        font-weight: 600;
        padding: 8px 18px;
    }


    /* =========================================================
       SMALLER WINDOWS
       ========================================================= */

    @media (max-width: 700px) {

        .date-filter-form {
            flex-direction: column;
            align-items: stretch;
            gap: 12px;
        }


        .date-filter-group .form-control {
            width: 100%;
        }


        .date-filter-action {
            align-items: stretch;
        }


        .date-filter-action button {
            width: 100%;
        }


        .chart-controls {
            justify-content: stretch;
        }


        #resetZoom {
            width: 100%;
        }

    }

</style>

<script>

document.addEventListener('DOMContentLoaded', function () {

    console.log("Test plots page loaded.");


    /*
     * ============================================================
     * CHECK HIGHCHARTS
     * ============================================================
     */

    if (typeof Highcharts === 'undefined') {

        console.error("Highcharts is not loaded.");

        document.getElementById('container').innerHTML =
            '<div class="alert alert-danger">' +
            'Highcharts is not loaded. Check base.html.' +
            '</div>';

        return;
    }


    /*
     * ============================================================
     * DOM ELEMENTS
     * ============================================================
     */

    const startDateInput =
        document.getElementById('start_date');

    const endDateInput =
        document.getElementById('end_date');

    const resetZoomButton =
        document.getElementById('resetZoom');

    const zoomStatus =
        document.getElementById('zoomStatus');


    /*
     * ============================================================
     * LOAD INITIAL DATA
     * ============================================================
     */

    let data_tension = [];
    let data_payout = [];

    let original_data_tension = [];
    let original_data_payout = [];


    try {

        data_tension = JSON.parse(
            "{{ data_json_tension|default:'[]'|escapejs }}"
        );

        data_payout = JSON.parse(
            "{{ data_json_payout|default:'[]'|escapejs }}"
        );


        /*
         * Keep untouched copies.
         *
         * These are restored by Reset Zoom.
         */

        original_data_tension =
            data_tension.map(
                point => ({ ...point })
            );

        original_data_payout =
            data_payout.map(
                point => ({ ...point })
            );


        console.log(
            "Initial tension points:",
            data_tension.length
        );

        console.log(
            "Initial payout points:",
            data_payout.length
        );

    } catch (error) {

        console.error(
            "Failed to parse chart data:",
            error
        );

        return;
    }


    /*
     * ============================================================
     * CONVERT DATA TO HIGHCHARTS FORMAT
     * ============================================================
     *
     * Highcharts datetime axes use timestamps in milliseconds.
     *
     * This means the chart itself is working with:
     *
     *     milliseconds
     *
     * and therefore supports:
     *
     *     hours
     *     minutes
     *     seconds
     *     milliseconds
     *
     * ============================================================
     */

    function toSeries(data) {

        return data.map(function (point) {

            return [
                new Date(
                    point.date.replace(' ', 'T') + 'Z'
                ).getTime(),

                point.value
            ];

        });

    }


    /*
     * ============================================================
     * GET ORIGINAL DATE/TIME RANGE
     * ============================================================
     *
     * Unlike the old version, this does NOT add a day.
     *
     * The user entered an exact start and end datetime.
     *
     * Example:
     *
     *     Start: 2026-09-01 08:30:00
     *     End:   2026-09-02 16:45:30
     *
     * Reset returns to exactly those timestamps.
     * ============================================================
     */



    function getOriginalDateRange() {

        const start =
            new Date(
                startDateInput.value + 'Z'
            );

        const end =
            new Date(
                endDateInput.value + 'Z'
            );

        return {

            min:
                start.getTime(),

            max:
                end.getTime()

        };

    }


    /*
     * ============================================================
     * MAXIMUM TENSION / NULL REGIONS
     * ============================================================
     */

    function updateMaxTension(chart) {

        const xAxis =
            chart.xAxis[0];

        console.log("=== updateMaxTension DEBUG ===");
        console.log("Axis min:", xAxis.min);
        console.log("Axis max:", xAxis.max);

        const firstPointTime =
            new Date(
                data_tension[0].date.replace(' ', 'T') + 'Z'
            ).getTime();

        const lastPointTime =
            new Date(
                data_tension[data_tension.length - 1].date.replace(' ', 'T') + 'Z'
            ).getTime();

        console.log("First data time:", firstPointTime);
        console.log("Last data time:", lastPointTime);

        const min =
            xAxis.min;

        const max =
            xAxis.max;




        /*
         * Find data currently visible.
         */

        const visibleTensionData =
            data_tension.filter(function (point) {

                const time =
                    new Date(
                        point.date.replace(' ', 'T') + 'Z'
                    ).getTime();

                return (
                    time >= min &&
                    time <= max
                );

            });


        /*
         * Remove NULL values.
         */

        const nonNullTension =
            visibleTensionData.filter(function (point) {

                return (
                    point.value !== null &&
                    point.value !== undefined
                );

            });


        /*
         * ========================================================
         * FIND NULL REGIONS
         * ========================================================
         */

        const nullBands = [];

        let i = 0;


        while (
            i < visibleTensionData.length
        ) {

            if (
                visibleTensionData[i].value === null
            ) {

                const startIdx = i;


                while (
                    i < visibleTensionData.length &&
                    visibleTensionData[i].value === null
                ) {

                    i++;

                }


                const previous =
                    visibleTensionData[startIdx - 1];

                const next =
                    visibleTensionData[i];


                /*
                 * Only create a band if valid data
                 * exists on both sides.
                 */

                if (previous && next) {

                    nullBands.push({

                        color:
                            'rgba(150, 150, 150, 0.30)',

                        from:
                            new Date(
                                previous.date.replace(' ', 'T') + 'Z'
                            ).getTime(),

                        to:
                            new Date(
                                next.date.replace(' ', 'T') + 'Z'
                            ).getTime(),

                        zIndex: 1

                    });

                }

            } else {

                i++;

            }

        }


        /*
         * ========================================================
         * FIND MAXIMUM TENSION
         * ========================================================
         */

        const plotLines = [];


        if (
            nonNullTension.length > 0
        ) {

            const maxPoint =
                nonNullTension.reduce(
                    function (a, b) {

                        return a.value > b.value
                            ? a
                            : b;

                    }
                );


            const maxDate =
                new Date(
                    maxPoint.date.replace(' ', 'T') + 'Z'
                ).getTime();


            plotLines.push({

                id: 'max-tension-line',

                color: 'red',

                width: 2,

                value: maxDate,

                label: {

                    text:
                        'Max Tension: ' +
                        Math.round(
                            maxPoint.value
                        ) +
                        ' lbs',

                    align: 'left',

                    verticalAlign: 'bottom',

                    x: 10,

                    y: -20,

                    rotation: 0,

                    style: {

                        color: 'red',

                        fontWeight: 'bold'

                    }

                }

            });

        }


        /*
         * ========================================================
         * NO DATA MESSAGE
         * ========================================================
         */

        if (chart.customNoDataLabel) {

            chart.customNoDataLabel.destroy();

            chart.customNoDataLabel = null;

        }


        if (
            nonNullTension.length === 0
        ) {

            chart.customNoDataLabel =
                chart.renderer.text(

                    'No values in the selected date/time range',

                    chart.plotLeft +
                    chart.plotWidth / 2 -
                    150,

                    chart.plotTop +
                    chart.plotHeight / 2

                )
                .css({

                    color: 'gray',

                    fontSize: '16px'

                })
                .attr({

                    zIndex: 5

                })
                .add();

        }


        /*
         * ========================================================
         * UPDATE AXIS DECORATIONS
         * ========================================================
         */

        xAxis.removePlotLine('max-tension-line');

        if (plotLines.length > 0) {
            xAxis.addPlotLine(plotLines[0]);
        }

        console.log("Max tension update:", {
            min: xAxis.min,
            max: xAxis.max,
            plotLines: plotLines.length,
            visiblePoints: visibleTensionData.length,
            nonNullPoints: nonNullTension.length
        });

    }


    /*
     * ============================================================
     * CREATE HIGHCHARTS CHART
     * ============================================================
     */

    const chart =
        Highcharts.chart(
            'container',
            {

                chart: {

                    /*
                     * Allow horizontal drag-to-zoom.
                     */

                    zoomType: 'x',

                    resetZoomButton: {
                        theme: {
                            display: 'none'
                        }
                    },

                    exporting: {
                        enabled: false
                    },

                    events: {

                        /*
                         * ====================================================
                         * ZOOM SELECTION
                         * ====================================================
                         */

                        selection:
                            function (event) {

                                /*
                                 * Ignore selections that don't
                                 * contain an X-axis range.
                                 */

                                if (
                                    !event.xAxis ||
                                    !event.xAxis.length
                                ) {

                                    return;

                                }


                                const min =
                                    event.xAxis[0].min;

                                const max =
                                    event.xAxis[0].max;


                                console.log(
                                    "================================"
                                );

                                console.log(
                                    "Zoom requested"
                                );

                                console.log(
                                    "Start:",
                                    new Date(min).toISOString()
                                );

                                console.log(
                                    "End:",
                                    new Date(max).toISOString()
                                );

                                console.log(
                                    "Duration:",
                                    (
                                        (max - min) / 1000
                                    ).toFixed(3),
                                    "seconds"
                                );


                                /*
                                 * =================================================
                                 * IMPORTANT
                                 * =================================================
                                 *
                                 * DO NOT call event.preventDefault().
                                 *
                                 * We want Highcharts to perform the
                                 * normal zoom operation.
                                 */

                                /*
                                 * =================================================
                                 * DETERMINE POINT LIMIT
                                 * =================================================
                                 */

                                const maxPts =
                                    Math.min(
                                        this.chartWidth,
                                        10000
                                    );


                                /*
                                 * =================================================
                                 * BUILD AJAX REQUEST
                                 * =================================================
                                 */

                                const params =
                                    new URLSearchParams({

                                        start:
                                            new Date(
                                                min
                                            ).toISOString(),

                                        end:
                                            new Date(
                                                max
                                            ).toISOString(),

                                        max_points:
                                            maxPts

                                    });


                                console.log(
                                    "TEST zoom request:",
                                    params.toString()
                                );


                                /*
                                 * Show loading status.
                                 */

                                zoomStatus.style.display =
                                    'block';

                                zoomStatus.className =
                                    'alert alert-secondary';

                                zoomStatus.innerHTML =
                                    '<strong>Zooming:</strong> ' +
                                    'Generating higher-resolution data...';


                                /*
                                 * =================================================
                                 * REQUEST HIGHER RESOLUTION DATA
                                 * =================================================
                                 */

                                fetch(
                                    "{% url 'chart_data_zoom_test' %}?" +
                                    params.toString()
                                )

                                .then(
                                    function (response) {

                                        if (
                                            !response.ok
                                        ) {

                                            throw new Error(
                                                "HTTP " +
                                                response.status
                                            );

                                        }

                                        return response.json();

                                    }
                                )

                                .then(
                                    function (data) {

                                        /*
                                         * Check server error.
                                         */

                                        if (
                                            data.error
                                        ) {

                                            throw new Error(
                                                data.error
                                            );

                                        }


                                        console.log(
                                            "Zoom response:",
                                            data.tension.length,
                                            "tension points"
                                        );


                                        /*
                                         * Replace current data.
                                         */

                                        data_tension =
                                            data.tension;

                                        data_payout =
                                            data.payout;


                                        /*
                                         * Replace chart series.
                                         */

                                        chart.series[0].setData(

                                            toSeries(
                                                data_tension
                                            ),

                                            false

                                        );


                                        chart.series[1].setData(

                                            toSeries(
                                                data_payout
                                            ),

                                            false

                                        );


                                        /*
                                         * IMPORTANT:
                                         *
                                         * Reapply the exact selected
                                         * timestamps after replacing
                                         * the data.
                                         */

                                        chart.xAxis[0].setExtremes(

                                            min,

                                            max,

                                            false

                                        );


                                        /*
                                         * Recalculate:
                                         *
                                         * - maximum tension
                                         * - NULL regions
                                         * - plot line
                                         * - plot bands
                                         */

                                        updateMaxTension(
                                            chart
                                        );


                                        /*
                                         * Redraw once.
                                         */

                                        chart.redraw();


                                        /*
                                         * Hide loading status.
                                         */

                                        zoomStatus.style.display =
                                            'none';


                                        console.log(
                                            "Zoom complete."
                                        );

                                    }
                                )

                                .catch(
                                    function (error) {

                                        console.error(
                                            "Zoom request failed:",
                                            error
                                        );


                                        zoomStatus.style.display =
                                            'block';

                                        zoomStatus.className =
                                            'alert alert-danger';

                                        zoomStatus.innerHTML =
                                            '<strong>Zoom error:</strong> ' +
                                            error.message;

                                    }
                                );

                            }

                    }

                },


                /*
                 * ============================================================
                 * TITLE
                 * ============================================================
                 */

                title: {

                    text:
                        null

                },


                subtitle: {

                    text:
                        null

                },


                /*
                 * ============================================================
                 * X AXIS
                 * ============================================================
                 */

                xAxis: {

                    type:
                        'datetime',

                    title: {

                        text:
                            'Time'

                    },

                    /*
                     * Do not force ticks to round
                     * to convenient boundaries.
                     */

                    startOnTick:
                        false,

                    endOnTick:
                        false,

                    minPadding:
                        0,

                    maxPadding:
                        0

                },


                /*
                 * ============================================================
                 * Y AXES
                 * ============================================================
                 */

                yAxis: [

                    {

                        title: {

                            text:
                                'Tension (lbs)'

                        },

                        labels: {

                            format:
                                '{value} lbs'

                        }

                    },

                    {

                        title: {

                            text:
                                'Payout (m)'

                        },

                        labels: {

                            format:
                                '{value} m'

                        },

                        opposite:
                            true

                    }

                ],


                /*
                 * ============================================================
                 * TOOLTIP
                 * ============================================================
                 */

                tooltip: {

                    shared:
                        true,

                    /*
                     * Include seconds.
                     */

                    xDateFormat:
                        '%Y-%m-%d %H:%M:%S',

                    valueDecimals:
                        2

                },


                /*
                 * ============================================================
                 * LEGEND
                 * ============================================================
                 */

                legend: {

                    enabled:
                        true

                },


                /*
                 * ============================================================
                 * SERIES
                 * ============================================================
                 */

                series: [

                    {

                        name:
                            'Tension',

                        yAxis:
                            0,

                        data:
                            toSeries(
                                data_tension
                            ),

                        color:
                            '#007bff',

                        connectNulls:
                            false

                    },

                    {

                        name:
                            'Payout',

                        yAxis:
                            1,

                        data:
                            toSeries(
                                data_payout
                            ),

                        color:
                            '#28a745'

                    }

                ]

            }
        );

    /*
    * ============================================================
    * INITIAL MAX TENSION
    * ============================================================
    */

    updateMaxTension(chart);


    /*
     * ============================================================
     * DATE/TIME VALIDATION
     * ============================================================
     */

    function validateDateRange() {

        if (
            !startDateInput.value ||
            !endDateInput.value
        ) {

            return true;

        }


        const start =
            new Date(
                startDateInput.value
            );

        const end =
            new Date(
                endDateInput.value
            );


        /*
         * End must be after start.
         */

        if (
            end <= start
        ) {

            alert(
                'End date/time must be after the start date/time.'
            );

            return false;

        }


        /*
         * Maximum allowed range.
         */

        const differenceMs =
            end.getTime() -
            start.getTime();

        const differenceDays =
            differenceMs /
            (1000 * 60 * 60 * 24);


        if (
            differenceDays > {{ max_days|default:"14" }}
        ) {

            alert(
                'The selected date/time range cannot exceed ' +
                '{{ max_days|default:"14" }} days.'
            );

            return false;

        }


        return true;

    }


    /*
     * ============================================================
     * FORM VALIDATION
     * ============================================================
     */

    document
        .getElementById('dateRangeForm')
        .addEventListener(
            'submit',
            function (event) {

                if (
                    !validateDateRange()
                ) {

                    event.preventDefault();

                }

            }
        );


    /*
     * ============================================================
     * START DATETIME CHANGED
     * ============================================================
     */

    startDateInput.addEventListener(
        'change',
        function () {

            if (
                !startDateInput.value
            ) {

                return;

            }


            /*
             * The end cannot be before
             * the selected start.
             */

            endDateInput.min =
                startDateInput.value;


            /*
             * Calculate maximum allowed end.
             */

            const start =
                new Date(
                    startDateInput.value
                );


            const maxEnd =
                new Date(
                    start
                );


            maxEnd.setDate(
                maxEnd.getDate() +
                {{ max_days|default:"14" }}
            );


            /*
             * Use local date/time formatting rather
             * than toISOString(), which can introduce
             * timezone shifts.
             */

            function formatDateTimeLocal(date) {

                const year =
                    date.getFullYear();

                const month =
                    String(
                        date.getMonth() + 1
                    ).padStart(2, '0');

                const day =
                    String(
                        date.getDate()
                    ).padStart(2, '0');

                const hours =
                    String(
                        date.getHours()
                    ).padStart(2, '0');

                const minutes =
                    String(
                        date.getMinutes()
                    ).padStart(2, '0');

                const seconds =
                    String(
                        date.getSeconds()
                    ).padStart(2, '0');


                return (
                    year + '-' +
                    month + '-' +
                    day + 'T' +
                    hours + ':' +
                    minutes + ':' +
                    seconds
                );

            }


            endDateInput.max =
                formatDateTimeLocal(
                    maxEnd
                );

        }
    );


    /*
     * ============================================================
     * SET INITIAL DATE/TIME LIMITS
     * ============================================================
     */

    if (
        startDateInput.value
    ) {

        endDateInput.min =
            startDateInput.value;


        const start =
            new Date(
                startDateInput.value
            );


        const maxEnd =
            new Date(
                start
            );


        maxEnd.setDate(
            maxEnd.getDate() +
            {{ max_days|default:"14" }}
        );


        function formatInitialDateTimeLocal(date) {

            const year =
                date.getFullYear();

            const month =
                String(
                    date.getMonth() + 1
                ).padStart(2, '0');

            const day =
                String(
                    date.getDate()
                ).padStart(2, '0');

            const hours =
                String(
                    date.getHours()
                ).padStart(2, '0');

            const minutes =
                String(
                    date.getMinutes()
                ).padStart(2, '0');

            const seconds =
                String(
                    date.getSeconds()
                ).padStart(2, '0');


            return (
                year + '-' +
                month + '-' +
                day + 'T' +
                hours + ':' +
                minutes + ':' +
                seconds
            );

        }


        endDateInput.max =
            formatInitialDateTimeLocal(
                maxEnd
            );

    }


    /*
     * ============================================================
     * RESET ZOOM
     * ============================================================
     *
     * This does NOT reload the page.
     *
     * It restores:
     *
     * 1. The original generated data
     * 2. The original exact start datetime
     * 3. The original exact end datetime
     * 4. The max-tension line
     * 5. The NULL regions
     *
     * ============================================================
     */

    resetZoomButton.addEventListener(
        'click',
        function () {

            console.log(
                "================================"
            );

            console.log(
                "Resetting chart"
            );


            /*
             * Restore original data.
             */

            data_tension =
                original_data_tension.map(
                    point => ({ ...point })
                );

            data_payout =
                original_data_payout.map(
                    point => ({ ...point })
                );


            console.log(
                "Restored:",
                data_tension.length,
                "tension points"
            );


            /*
             * Restore series.
             */

            chart.series[0].setData(

                toSeries(
                    data_tension
                ),

                false

            );


            chart.series[1].setData(

                toSeries(
                    data_payout
                ),

                false

            );


            /*
             * Get the EXACT original
             * datetime range from the form.
             */

            const originalRange =
                getOriginalDateRange();


            console.log(
                "Reset start:",
                new Date(
                    originalRange.min
                ).toISOString()
            );


            console.log(
                "Reset end:",
                new Date(
                    originalRange.max
                ).toISOString()
            );


            console.log(
                "Reset duration:",
                (
                    (
                        originalRange.max -
                        originalRange.min
                    ) / 1000
                ).toFixed(3),
                "seconds"
            );


            /*
             * Restore exact X-axis extremes.
             */

            chart.xAxis[0].setExtremes(

                originalRange.min,

                originalRange.max,

                false

            );


            /*
             * Recalculate chart decorations.
             */

            updateMaxTension(
                chart
            );


            /*
             * Redraw.
             */

            chart.redraw();


            /*
             * Hide loading message.
             */

            zoomStatus.style.display =
                'none';

            zoomStatus.className =
                'alert alert-secondary';


            console.log(
                "Chart reset complete."
            );

        }
    );

});

</script>
